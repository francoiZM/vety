
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>calculoDosis</ion-title>
    </ion-toolbar>
  </ion-header>

  <!--input para ingresar el peso de la mascota y calcularlo en base a eso con los medicamenteos seleccionados en inventario-m.page.html-->
  <ion-content class="ion-padding">
    <ion-list>
      <ion-list-header>
        <ion-label>Medicamentos Seleccionados</ion-label>
      </ion-list-header>
      <ion-item *ngFor="let med of medicamentoSeleccionado">
        <ion-label>{{ med.nombre }}</ion-label>
      </ion-item>
    </ion-list>
    <ion-item>
      <ion-label position="floating">Peso de la mascota (kg)</ion-label>
      <ion-input type="number" [(ngModel)]="pesoMascota"></ion-input>
    </ion-item>

    <ion-button
      expand="full"
      (click)="calcularDosis()"
      class="ion-margin-top"
      [disabled]="!pesoMascota || medicamentoSeleccionado.length === 0"
    >
      Calcular Dosis
    </ion-button>

    <!-- mostrar resultados de dosis calculadas -->
    <ion-list *ngIf="dosisCalculadas.length > 0">
      <ion-list-header>
        <ion-label>Dosis Calculadas</ion-label>
      </ion-list-header>
      <ion-item *ngFor="let dosis of dosisCalculadas">
        <ion-label>
          <h2>{{ dosis.medicamento }}</h2>
          <p>Dosis: {{ dosis.cantidad.toFixed(2) }} ml</p>
        </ion-label>
      </ion-item>
    </ion-list>
    <div *ngIf="dosisCalculadas.length > 0" class="ion-margin-top">
      <ion-item>
        <ion-label position="stacked">Hora de notificación</ion-label>
        <ion-input type="time" [(ngModel)]="horaNotificacion"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Cantidad de días</ion-label>
        <ion-input type="number" min="1" [(ngModel)]="diasNotificacion"></ion-input>
      </ion-item>
      <ion-button expand="block" color="primary" class="ion-margin-top" (click)="crearTareaRecordatorio()">
        Crear tarea y programar recordatorio
      </ion-button>
      <ion-button expand="block" color="secondary" class="ion-margin-top" (click)="probarNotificacion()">
        Probar notificación ahora
      </ion-button>
    </div>
  </ion-content>
