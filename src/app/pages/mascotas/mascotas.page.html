  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Mascotas</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-content class="ion-padding">
  <ion-card *ngFor="let mascota of mascotas">
    <ion-card-header>
      <ion-card-title>
        {{ mascota.nombre }}
        <ion-badge color="primary" style="margin-left: 8px;">{{ mascota.especie }}</ion-badge>
      </ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div class="mascota-info">
        <p><strong>Raza:</strong> {{ mascota.raza }}</p>
        <p><strong>Peso:</strong> {{ mascota.peso }} kg</p>
        <p *ngIf="mascota.usuario">
          <strong>Tutor:</strong> {{ mascota.usuario.nombre }} {{ mascota.usuario.apellido }}
        </p>
      </div>
    </ion-card-content>
  </ion-card>
  
  <div *ngIf="mascotas.length === 0" class="empty-state">
    <p>No hay mascotas registradas</p>
  </div>
</ion-content>
